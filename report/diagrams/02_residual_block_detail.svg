<svg viewBox="0 0 1200 480" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect width="1200" height="480" fill="#fbfaf7"/>
  <text x="600" y="36" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">The Residual Block — how SimpleNet became ResNet</text>
  <text x="600" y="58" text-anchor="middle" font-size="13" fill="#6b7280">Every stage of ResNet18 / FlexResNet is built from blocks that look exactly like this one</text>

  <!-- input -->
  <g>
    <circle cx="90" cy="180" r="26" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/>
    <text x="90" y="185" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">x</text>
    <text x="90" y="228" text-anchor="middle" font-size="11" fill="#6b7280">block input</text>
  </g>

  <!-- split into two paths -->
  <path d="M116 180 L160 180" stroke="#9ca3af" stroke-width="2"/>
  <path d="M160 180 L160 100 L200 100" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow2)"/>
  <path d="M160 180 L160 340 L200 340" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- MAIN PATH (top) -->
  <text x="440" y="55" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">main path</text>

  <g>
    <rect x="200" y="70" width="130" height="60" rx="8" fill="#fca5a5" stroke="#7f1d1d" stroke-width="2"/>
    <text x="265" y="95" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">Conv 3x3</text>
    <text x="265" y="112" text-anchor="middle" font-size="11" fill="#7f1d1d">BatchNorm + ReLU</text>
  </g>
  <path d="M330 100 L360 100" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow2)"/>

  <g>
    <rect x="360" y="70" width="60" height="60" rx="8" fill="#fdba74" stroke="#7c2d12" stroke-width="2"/>
    <text x="390" y="104" text-anchor="middle" font-size="12" font-weight="700" fill="#1f2937">Dropout</text>
  </g>
  <text x="390" y="150" text-anchor="middle" font-size="10" fill="#9ca3af">(FlexResNet only,</text>
  <text x="390" y="163" text-anchor="middle" font-size="10" fill="#9ca3af">skipped when 0.0)</text>

  <path d="M420 100 L450 100" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow2)"/>

  <g>
    <rect x="450" y="70" width="130" height="60" rx="8" fill="#fca5a5" stroke="#7f1d1d" stroke-width="2"/>
    <text x="515" y="95" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2937">Conv 3x3</text>
    <text x="515" y="112" text-anchor="middle" font-size="11" fill="#7f1d1d">BatchNorm (no ReLU yet)</text>
  </g>

  <path d="M580 100 L640 100 L640 180 L660 180" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- SHORTCUT PATH (bottom) -->
  <text x="440" y="315" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">shortcut path</text>
  <g>
    <rect x="200" y="330" width="230" height="60" rx="8" fill="#e5e7eb" stroke="#6b7280" stroke-width="2" stroke-dasharray="6,4"/>
    <text x="315" y="355" text-anchor="middle" font-size="12" font-weight="600" fill="#374151">identity (pass x through unchanged)</text>
    <text x="315" y="372" text-anchor="middle" font-size="11" fill="#6b7280">used when shape does not change</text>
  </g>
  <text x="315" y="415" text-anchor="middle" font-size="11" fill="#9ca3af">if stride != 1 or channels change:</text>
  <text x="315" y="430" text-anchor="middle" font-size="11" fill="#9ca3af">shortcut becomes a 1x1 Conv + BatchNorm instead,</text>
  <text x="315" y="445" text-anchor="middle" font-size="11" fill="#9ca3af">so both paths line up before adding</text>

  <path d="M430 360 L640 360 L640 200 L660 200" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- ADD -->
  <g>
    <circle cx="690" cy="190" r="28" fill="#ffffff" stroke="#111827" stroke-width="2.5"/>
    <text x="690" y="198" text-anchor="middle" font-size="22" font-weight="700" fill="#111827">+</text>
  </g>
  <text x="690" y="240" text-anchor="middle" font-size="11" fill="#6b7280">element-wise add</text>

  <path d="M718 190 L760 190" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow2)"/>

  <!-- Final ReLU -->
  <g>
    <rect x="770" y="160" width="110" height="60" rx="8" fill="#86efac" stroke="#14532d" stroke-width="2"/>
    <text x="825" y="195" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">ReLU</text>
  </g>

  <path d="M880 190 L920 190" stroke="#9ca3af" stroke-width="2" marker-end="url(#arrow2)"/>

  <g>
    <circle cx="960" cy="190" r="26" fill="#93c5fd" stroke="#1e3a8a" stroke-width="2"/>
    <text x="960" y="196" text-anchor="middle" font-size="13" font-weight="700" fill="#1f2937">out</text>
  </g>
  <text x="960" y="238" text-anchor="middle" font-size="11" fill="#6b7280">block output</text>

  <defs>
    <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#9ca3af"/>
    </marker>
  </defs>
</svg>
